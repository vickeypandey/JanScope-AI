services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/janscope.db
      CHROMA_PATH: /app/data/chroma
      ALLOW_ORIGINS: http://localhost:8501,http://127.0.0.1:8501
    volumes:
      - janscope_data:/app/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    environment:
      JANSCOPE_BACKEND_URL: http://backend:8000
      PROJECT_GITHUB_URL: ${PROJECT_GITHUB_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8501:8501"

volumes:
  janscope_data:
