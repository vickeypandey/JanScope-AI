services:
  - type: web
    name: janscope-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CHROMA_PATH
        value: /tmp/janscope-chroma
      - key: VECTOR_BACKEND
        value: memory
      - key: SEED_SAMPLE_DATA
        value: "true"
      - key: AI_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.7-flash
      - key: GEMINI_API_KEY
        sync: false
      - key: AUTH_ENABLED
        value: "true"
      - key: OTP_DELIVERY_MODE
        value: brevo_api
      - key: OTP_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM_EMAIL
        sync: false
      - key: CONVERSATION_ACCESS_SECRET
        generateValue: true
      - key: ALLOW_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PROJECT_GITHUB_URL
        value: https://github.com/vickeypandey/JanScope-AI
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: API_DOCS_ENABLED
        value: "false"
      - key: INGESTION_ENABLED
        value: "false"
      - key: LIVE_SOURCE_SYNC_ENABLED
        value: "false"
